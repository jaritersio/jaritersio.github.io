<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¿Te quieres casar conmigo?</title>

    <!-- Google Fonts & Tailwind CSS & Confetti CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Great+Vibes&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ffe4e6 0%, #fecdd3 50%, #fda4af 100%);
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
            position: relative;
        }

        .font-handwriting { font-family: 'Great Vibes', cursive; }
        .font-playful { font-family: 'Fredoka', sans-serif; }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px rgba(225, 29, 72, 0.15);
        }

        #heart-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        #decorations-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .love-letter {
            position: absolute;
            font-size: 28px;
            opacity: 0;
            animation: floatUpLetter linear infinite;
            filter: drop-shadow(0 4px 6px rgba(225, 29, 72, 0.25));
            user-select: none;
        }

        @keyframes floatUpLetter {
            0% { transform: translateY(110vh) rotate(0deg) scale(0.6); opacity: 0; }
            10% { opacity: 0.85; }
            90% { opacity: 0.85; }
            100% { transform: translateY(-20vh) rotate(360deg) scale(1); opacity: 0; }
        }

        .petal {
            position: absolute;
            font-size: 22px;
            opacity: 0;
            animation: fallPetal linear infinite;
            user-select: none;
            filter: drop-shadow(0 2px 4px rgba(244, 63, 94, 0.2));
        }

        @keyframes fallPetal {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
            10% { opacity: 0.8; }
            50% { transform: translateY(50vh) rotate(180deg) translateX(30px); }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg) translateX(-30px); opacity: 0; }
        }

        .butterfly {
            position: absolute;
            font-size: 20px;
            opacity: 0;
            animation: flutter linear infinite;
            filter: drop-shadow(0 2px 6px rgba(236, 72, 153, 0.35));
            user-select: none;
        }

        @keyframes flutter {
            0% { transform: translateX(-10vw) translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.9; }
            25% { transform: translateX(20vw) translateY(-30px) rotate(20deg); }
            50% { transform: translateX(50vw) translateY(20px) rotate(-15deg); }
            75% { transform: translateX(80vw) translateY(-25px) rotate(20deg); }
            90% { opacity: 0.9; }
            100% { transform: translateX(110vw) translateY(0) rotate(0deg); opacity: 0; }
        }

        .love-quote {
            position: absolute;
            font-family: 'Great Vibes', cursive;
            color: #be123c;
            font-size: 20px;
            font-weight: 700;
            opacity: 0;
            white-space: nowrap;
            animation: quoteFloat linear infinite;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.9), 0 0 12px rgba(244, 63, 94, 0.3);
            pointer-events: none;
            user-select: none;
        }

        @keyframes quoteFloat {
            0% { transform: translateY(100vh) scale(0.85); opacity: 0; }
            15% { opacity: 0.85; }
            85% { opacity: 0.85; }
            100% { transform: translateY(-15vh) scale(1); opacity: 0; }
        }

        .big-heart-bg {
            position: absolute;
            font-size: 140px;
            opacity: 0.06;
            animation: heartbeat 3s ease-in-out infinite;
            pointer-events: none;
            user-select: none;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
            75% { transform: scale(1.08); }
        }

        .click-heart {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            animation: clickHeartFloat 1.5s ease-out forwards;
            font-size: 24px;
        }

        @keyframes clickHeartFloat {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.4) rotate(var(--rot)); opacity: 0; }
        }

        .interactive-btn {
            transition: transform 0.2s ease, top 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-relocated { position: fixed !important; z-index: 99; }

        @keyframes gentle-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        .animate-gentle-pulse { animation: gentle-pulse 2s infinite ease-in-out; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-12px); }
            40%, 80% { transform: translateX(12px); }
        }

        .shake-modal { animation: shake 0.5s ease-in-out; }

        @keyframes float-heart-burst {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.4) rotate(30deg); opacity: 0; }
        }

        .heart-burst-particle {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            animation: float-heart-burst 1.2s ease-out forwards;
        }

        /* Reproductor MP3 oculto */
        #bg-music {
            position: fixed;
            bottom: 0; left: 0;
            width: 2px; height: 2px;
            opacity: 0.01;
            pointer-events: none;
            z-index: 1;
        }

        .card-sparkle {
            position: absolute;
            font-size: 22px;
            animation: cardSparkle 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes cardSparkle {
            0%, 100% {
                transform: scale(0.7) rotate(0deg);
                opacity: 0.4;
                filter: drop-shadow(0 0 0 rgba(244, 63, 94, 0));
            }
            50% {
                transform: scale(1.2) rotate(180deg);
                opacity: 1;
                filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.6));
            }
        }

        .orbit-heart {
            position: absolute;
            font-size: 20px;
            animation: orbit 8s linear infinite;
            pointer-events: none;
        }

        @keyframes orbit {
            from { transform: rotate(0deg) translateX(90px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(90px) rotate(-360deg); }
        }

        @media (max-width: 480px) {
            .love-quote { font-size: 16px; }
            .big-heart-bg { font-size: 100px; }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4 relative select-none">
    <!-- Canvas de corazones -->
    <canvas id="heart-canvas"></canvas>

    <!-- Capa de decoraciones flotantes -->
    <div id="decorations-layer">
        <div class="big-heart-bg" style="top: 8%; left: 5%; animation-delay: 0s;">&#10084;</div>
        <div class="big-heart-bg" style="top: 60%; right: 6%; animation-delay: 1.5s;">&#10084;</div>
        <div class="big-heart-bg" style="bottom: 8%; left: 10%; animation-delay: 0.8s;">&#10084;</div>
        <div class="big-heart-bg" style="top: 30%; right: 40%; animation-delay: 2.2s;">&#10084;</div>
    </div>

    <!-- Reproductor de música MP3 (archivo en la misma carpeta) -->
    <audio id="bg-music" loop preload="auto">
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <div class="relative z-10 w-full max-w-lg mx-auto text-center">

        <!-- MAIN PROPOSAL CARD -->
        <div id="proposal-card" class="glass-card rounded-3xl p-6 md:p-10 transition-all duration-500 transform scale-100 relative">
            
            <span class="card-sparkle" style="top: -12px; left: 20px; animation-delay: 0s;">&#10024;</span>
            <span class="card-sparkle" style="top: -12px; right: 30px; animation-delay: 0.5s;">&#10024;</span>
            <span class="card-sparkle" style="bottom: -12px; left: 40px; animation-delay: 1s;">&#10024;</span>
            <span class="card-sparkle" style="bottom: -12px; right: 20px; animation-delay: 1.5s;">&#10024;</span>
            <span class="card-sparkle" style="top: 50%; left: -14px; animation-delay: 0.7s;">&#128156;</span>
            <span class="card-sparkle" style="top: 50%; right: -14px; animation-delay: 1.8s;">&#128150;</span>

            <div class="relative inline-block mb-4">
                <div class="relative w-40 h-40 md:w-48 md:h-48 mx-auto">
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <span class="orbit-heart" style="animation-delay: 0s;">&#128149;</span>
                        <span class="orbit-heart" style="animation-delay: -2s;">&#10084;</span>
                        <span class="orbit-heart" style="animation-delay: -4s;">&#128150;</span>
                        <span class="orbit-heart" style="animation-delay: -6s;">&#128158;</span>
                    </div>
                    <div class="w-40 h-40 md:w-48 md:h-48 bg-rose-100 rounded-full flex items-center justify-center mx-auto shadow-inner border-4 border-rose-200 animate-gentle-pulse overflow-hidden">
                        <img id="cat-image" 
                             src="https://media.tenor.com/o7YPH8zGwHsAAAAe/gato-rogando.png" 
                             alt="Gato rogando" 
                             class="w-full h-full object-contain scale-125 transition-all duration-300">
                    </div>
                </div>
            </div>

            <h1 id="proposal-title" class="font-playful text-3xl md:text-4xl font-extrabold text-rose-600 mb-2 leading-tight">
                ¿Te quieres casar conmigo?
            </h1>
            <p id="sub-message" class="text-gray-600 text-sm md:text-base font-semibold mb-6">
                Eres el amor de mi vida y mi mayor felicidad...
            </p>

            <div id="status-badge" class="inline-block bg-rose-50 text-rose-500 font-bold text-xs md:text-sm px-4 py-1.5 rounded-full border border-rose-200 mb-6 transition-all duration-300">
                Elige una opción mi amor
            </div>

            <div id="button-container" class="relative min-h-[120px] flex flex-col sm:flex-row items-center justify-center gap-4 p-2">
                
                <button id="btn-yes" 
                        class="interactive-btn w-full sm:w-auto bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-playful font-bold text-lg md:text-xl px-8 py-4 rounded-2xl shadow-lg shadow-teal-500/30 active:scale-95 flex items-center justify-center gap-2">
                    <span id="yes-btn-text">¡SÍ!</span>
                </button>

                <button id="btn-no" 
                        class="interactive-btn w-full sm:w-auto bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-600 hover:to-red-700 text-white font-playful font-bold text-lg md:text-xl px-8 py-4 rounded-2xl shadow-lg shadow-rose-500/30 active:scale-95 flex items-center justify-center gap-2">
                    <span id="no-btn-text">NO</span>
                </button>

            </div>
        </div>

        <!-- MODAL -->
        <div id="angry-cat-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/65 backdrop-blur-md transition-opacity duration-300">
            <div class="glass-card bg-white rounded-3xl p-6 md:p-8 max-w-md w-full text-center relative border-4 border-red-400 shadow-2xl shake-modal">
                
                <h2 class="font-playful text-2xl md:text-3xl font-extrabold text-red-600 mb-2">
                    ¡¿CÓMO QUE NO?!
                </h2>

                <div class="my-4 rounded-2xl overflow-hidden border-4 border-red-200 shadow-md bg-rose-100 flex justify-center items-center">
                    <img id="angry-cat-img" 
                         src="https://i.pinimg.com/1200x/f2/8f/8b/f28f8ba088b0158a82ae4f8dcfe072ae.jpg" 
                         alt="Imagen enojada" 
                         class="w-full h-auto object-contain"
                         onerror="this.onerror=null; this.src='https://media.giphy.com/media/13CoXDiaCcCoyk/giphy.gif';" />
                </div>

                <p class="text-red-700 font-extrabold mb-6 text-base md:text-lg leading-snug">
                    ¡Estás obligada a decir que SÍ!<br>
                    <span class="text-xs md:text-sm text-red-500 font-semibold">No hay otra opción, mi amor</span>
                </p>

                <button id="btn-angry-retry" 
                        class="w-full bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-playful font-bold text-lg py-3.5 px-6 rounded-2xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
                    <span>Está bien, diré que SÍ</span>
                </button>
            </div>
        </div>

        <!-- CELEBRATION SUCCESS CARD -->
        <div id="celebration-card" class="hidden glass-card rounded-3xl p-6 md:p-10 transition-all duration-700 transform scale-90 opacity-0 relative">
            
            <span class="card-sparkle" style="top: -12px; left: 20px;">&#10024;</span>
            <span class="card-sparkle" style="top: -12px; right: 30px; animation-delay: 0.5s;">&#10024;</span>
            <span class="card-sparkle" style="bottom: -12px; left: 40px; animation-delay: 1s;">&#10024;</span>
            <span class="card-sparkle" style="bottom: -12px; right: 20px; animation-delay: 1.5s;">&#10024;</span>

            <div class="rounded-3xl overflow-hidden border-4 border-rose-200 shadow-xl mb-6 max-w-sm mx-auto bg-rose-50 flex justify-center items-center">
                <img src="https://i.pinimg.com/474x/da/fe/4b/dafe4b674f37da8b9b56dfbff9dee17a.jpg" 
                     alt="Celebración" 
                     class="w-full h-auto object-contain"
                     onerror="this.onerror=null; this.src='https://i.pinimg.com/736x/ee/76/79/ee7679e6b8a55c1c9906693c844458c4.jpg';" />
            </div>

            <div class="p-4 bg-rose-50 rounded-2xl border border-rose-200 text-rose-700 font-bold text-sm md:text-base flex items-center justify-center gap-2 shadow-inner">
                <span>¡Juntos por siempre y para siempre!</span>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        // DECORACIONES
        // ============================================================
        const decoLayer = document.getElementById('decorations-layer');

        const letterIcons = ['&#128140;', '&#128139;', '&#128149;', '&#128150;', '&#128158;', '&#10084;'];
        const letterCount = 14;
        for (let i = 0; i < letterCount; i++) {
            const el = document.createElement('div');
            el.className = 'love-letter';
            el.innerHTML = letterIcons[Math.floor(Math.random() * letterIcons.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (Math.random() * 12 + 14) + 's';
            el.style.animationDelay = (Math.random() * 14) + 's';
            el.style.fontSize = (Math.random() * 14 + 20) + 'px';
            decoLayer.appendChild(el);
        }

        const petalIcons = ['&#127801;', '&#127802;', '&#127804;', '&#127803;', '&#10024;'];
        const petalCount = 16;
        for (let i = 0; i < petalCount; i++) {
            const el = document.createElement('div');
            el.className = 'petal';
            el.innerHTML = petalIcons[Math.floor(Math.random() * petalIcons.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (Math.random() * 8 + 10) + 's';
            el.style.animationDelay = (Math.random() * 15) + 's';
            el.style.fontSize = (Math.random() * 10 + 18) + 'px';
            decoLayer.appendChild(el);
        }

        const butterflyIcons = ['&#129419;', '&#129412;', '&#129419;'];
        const butterflyCount = 6;
        for (let i = 0; i < butterflyCount; i++) {
            const el = document.createElement('div');
            el.className = 'butterfly';
            el.innerHTML = butterflyIcons[Math.floor(Math.random() * butterflyIcons.length)];
            el.style.top = (Math.random() * 80 + 5) + 'vh';
            el.style.animationDuration = (Math.random() * 15 + 15) + 's';
            el.style.animationDelay = (Math.random() * 20) + 's';
            el.style.fontSize = (Math.random() * 10 + 18) + 'px';
            decoLayer.appendChild(el);
        }

        const quotes = [
            'Te amo', 'Eres mi todo', 'Mi corazón es tuyo', 'Contigo siempre',
            'Eres mi sueño', 'Mi persona favorita', 'Te quiero infinito',
            'Eres mi felicidad', 'Mi amor eterno', 'Eres especial',
            'Juntos por siempre', 'Mi media naranja'
        ];
        const quoteCount = 10;
        for (let i = 0; i < quoteCount; i++) {
            const el = document.createElement('div');
            el.className = 'love-quote';
            el.innerText = quotes[Math.floor(Math.random() * quotes.length)];
            el.style.left = Math.random() * 80 + 5 + 'vw';
            el.style.animationDuration = (Math.random() * 15 + 18) + 's';
            el.style.animationDelay = (Math.random() * 20) + 's';
            decoLayer.appendChild(el);
        }
        // ============================================================

        // ============================================================
        // BACKGROUND MUSIC - MP3 (archivo local en la misma carpeta)
        // ============================================================
        const bgMusic = document.getElementById('bg-music');
        let musicStarted = false;

        function startMusic() {
            if (musicStarted) return;
            musicStarted = true;
            bgMusic.volume = 0.7;
            const playPromise = bgMusic.play();
            if (playPromise !== undefined) {
                playPromise.catch((error) => {
                    console.warn('No se pudo reproducir el MP3:', error);
                    musicStarted = false;
                });
            }
        }

        function enableMusicOnFirstInteraction() {
            const enableAudio = () => {
                startMusic();
                document.removeEventListener('click', enableAudio);
                document.removeEventListener('touchstart', enableAudio);
                document.removeEventListener('keydown', enableAudio);
            };

            document.addEventListener('click', enableAudio, { once: true });
            document.addEventListener('touchstart', enableAudio, { once: true });
            document.addEventListener('keydown', enableAudio, { once: true });
        }

        enableMusicOnFirstInteraction();
        // ============================================================

        let noClicks = 0;
        const MAX_NO_CLICKS = 5;

        let yesClicks = 0;
        const MAX_YES_CLICKS = 3;

        const noMessages = [
            "NO",
            "¿En serio?",
            "Piénsalo bien...",
            "¡No me hagas esto!",
            "¡Última oportunidad!"
        ];

        const yesMessages = [
            "¡SÍ!",
            "¿Estás segura bebé?",
            "¿100% segurísima mi amor?",
            "¡Acepto!"
        ];

        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const noBtnText = document.getElementById('no-btn-text');
        const yesBtnText = document.getElementById('yes-btn-text');
        const statusBadge = document.getElementById('status-badge');
        const proposalCard = document.getElementById('proposal-card');
        const celebrationCard = document.getElementById('celebration-card');
        const angryModal = document.getElementById('angry-cat-modal');
        const btnAngryRetry = document.getElementById('btn-angry-retry');
        const catImage = document.getElementById('cat-image');

        document.addEventListener('click', (e) => {
            spawnClickHearts(e.clientX, e.clientY);
        });

        function spawnClickHearts(x, y) {
            const icons = ['&#10084;', '&#128150;', '&#128149;', '&#128158;', '&#10024;'];
            for (let i = 0; i < 5; i++) {
                const h = document.createElement('div');
                h.className = 'click-heart';
                h.innerHTML = icons[Math.floor(Math.random() * icons.length)];
                h.style.left = x + 'px';
                h.style.top = y + 'px';
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 100 + 40;
                h.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                h.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
                h.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 1500);
            }
        }

        function moveButtonToRandomPos(btn) {
            if (!btn.classList.contains('btn-relocated')) {
                btn.classList.add('btn-relocated');
            }

            const padding = 20;
            const btnWidth = btn.offsetWidth || 160;
            const btnHeight = btn.offsetHeight || 50;

            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const minX = padding;
            const minY = padding;

            const randomX = Math.max(minX, Math.floor(Math.random() * (maxX - minX + 1)) + minX);
            const randomY = Math.max(minY, Math.floor(Math.random() * (maxY - minY + 1)) + minY);

            btn.style.left = `${randomX}px`;
            btn.style.top = `${randomY}px`;

            spawnHeartBurst(randomX + btnWidth / 2, randomY + btnHeight / 2);
        }

        function spawnHeartBurst(x, y) {
            const icons = ['&#10084;', '&#128150;', '&#128149;', '&#10024;', '&#128158;'];
            for (let i = 0; i < 6; i++) {
                const p = document.createElement('div');
                p.className = 'heart-burst-particle';
                p.style.fontSize = (Math.random() * 10 + 18) + 'px';
                p.innerHTML = icons[Math.floor(Math.random() * icons.length)];
                p.style.left = `${x + (Math.random() * 60 - 30)}px`;
                p.style.top = `${y + (Math.random() * 60 - 30)}px`;
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1200);
            }
        }

        btnNo.addEventListener('click', (e) => {
            e.preventDefault();
            noClicks++;

            if (noClicks < MAX_NO_CLICKS) {
                noBtnText.innerText = noMessages[noClicks];
                moveButtonToRandomPos(btnNo);
            } else {
                angryModal.classList.remove('hidden');
            }
        });

        btnAngryRetry.addEventListener('click', () => {
            angryModal.classList.add('hidden');
            
            noClicks = 0;
            btnNo.classList.remove('btn-relocated');
            btnNo.style.left = '';
            btnNo.style.top = '';
            noBtnText.innerText = noMessages[0];

            // Eliminar el botón "NO"
            btnNo.style.display = 'none';

            // Cambiar la imagen del círculo
            catImage.src = "https://ih1.redbubble.net/image.5356383745.5149/pp,504x498-pad,600x600,f8f8f8.u1.jpg";
            catImage.alt = "Nueva imagen";
        });

        btnYes.addEventListener('click', (e) => {
            e.preventDefault();
            yesClicks++;

            if (yesClicks < MAX_YES_CLICKS) {
                yesBtnText.innerText = yesMessages[yesClicks];
                moveButtonToRandomPos(btnYes);
            } else {
                triggerCelebration();
            }
        });

        function triggerCelebration() {
            proposalCard.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                proposalCard.classList.add('hidden');
                
                celebrationCard.classList.remove('hidden');
                setTimeout(() => {
                    celebrationCard.classList.remove('scale-90', 'opacity-0');
                    celebrationCard.classList.add('scale-100', 'opacity-100');
                }, 50);
            }, 300);

            btnNo.style.display = 'none';
            btnYes.style.display = 'none';

            const count = 200;
            const defaults = { origin: { y: 0.7 } };

            function fireConfetti(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fireConfetti(0.25, { spread: 26, startVelocity: 55, colors: ['#ff0000', '#ffa500'] });
            fireConfetti(0.2, { spread: 60, colors: ['#ffffff', '#ff69b4'] });
            fireConfetti(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fireConfetti(0.1, { spread: 120, startVelocity: 25, decay: 0.92, colors: ['#e11d48', '#f43f5e'] });
            fireConfetti(0.1, { spread: 120, startVelocity: 45 });

            setInterval(() => {
                confetti({
                    particleCount: 6,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#f43f5e', '#ec4899', '#fda4af']
                });
                confetti({
                    particleCount: 6,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#f43f5e', '#ec4899', '#fda4af']
                });
            }, 800);

            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'petal';
                heart.innerHTML = ['&#10084;', '&#128140;', '&#128150;', '&#128149;'][Math.floor(Math.random() * 4)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                heart.style.animationDelay = '0s';
                heart.style.fontSize = (Math.random() * 12 + 20) + 'px';
                document.getElementById('decorations-layer').appendChild(heart);
                setTimeout(() => heart.remove(), 8000);
            }, 400);
        }

        const canvas = document.getElementById('heart-canvas');
        const ctx = canvas.getContext('2d');
        let hearts = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class HeartParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.size = Math.random() * 14 + 8;
                this.speed = Math.random() * 1.5 + 0.6;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.color = ['#f43f5e', '#fb7185', '#fda4af', '#e11d48'][Math.floor(Math.random() * 4)];
                this.swing = Math.random() * 0.05;
                this.swingAngle = Math.random() * Math.PI * 2;
            }

            update() {
                this.y -= this.speed;
                this.swingAngle += this.swing;
                this.x += Math.sin(this.swingAngle) * 0.6;

                if (this.y < -20) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                const topCurveHeight = this.size * 0.3;
                ctx.moveTo(this.x, this.y + topCurveHeight);
                ctx.bezierCurveTo(
                    this.x, this.y, 
                    this.x - this.size / 2, this.y, 
                    this.x - this.size / 2, this.y + topCurveHeight
                );
                ctx.bezierCurveTo(
                    this.x - this.size / 2, this.y + (this.size + topCurveHeight) / 2, 
                    this.x, this.y + this.size, 
                    this.x, this.y + this.size
                );
                ctx.bezierCurveTo(
                    this.x, this.y + this.size, 
                    this.x + this.size / 2, this.y + (this.size + topCurveHeight) / 2, 
                    this.x + this.size / 2, this.y + topCurveHeight
                );
                ctx.bezierCurveTo(
                    this.x + this.size / 2, this.y, 
                    this.x, this.y, 
                    this.x, this.y + topCurveHeight
                );
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 40; i++) {
            hearts.push(new HeartParticle());
        }

        function animateHearts() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hearts.forEach(h => {
                h.update();
                h.draw();
            });
            requestAnimationFrame(animateHearts);
        }

        window.onload = function() {
            animateHearts();
        };
    </script>
</body>
</html>
